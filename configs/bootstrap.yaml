seed: 42

data:
  lr_dir: train/NoisyLR
  gt_dir: train/GT
  test_dir: NoisyLR
  val_ratio: 0.1
  num_workers: 0
  pin_memory: false
  scale: 2
  augment: false
  extra_noise_prob: 0.0
  extra_noise_std: 0.0
  speckle_prob: 0.0
  speckle_std: 0.0
  input_dropout_prob: 0.0
  input_dropout_ratio: 0.0

model:
  name: rrdb_restorer
  in_channels: 1
  out_channels: 1
  num_feat: 96
  num_block: 16
  num_grow_ch: 48
  scale: 2
  residual_scale: 0.2
  attn_every: 4
  noise_feat: 32

loss:
  charbonnier_weight: 1.0
  ssim_weight: 1.5
  edge_weight: 0.15
  fft_weight: 0.05
  laplacian_weight: 0.05
  charbonnier_eps: 1.0e-3

train:
  epochs: 1
  batch_size: 1
  lr: 2.0e-4
  weight_decay: 1.0e-4
  amp: false
  save_dir: weights
