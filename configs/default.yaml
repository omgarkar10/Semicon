seed: 42

data:
  lr_dir: train/NoisyLR
  gt_dir: train/GT
  test_dir: NoisyLR
  val_ratio: 0.1
  num_workers: 4
  pin_memory: true
  # LR is 128x128 float32 with speckle outside [0, 1]; do not min-max normalize.
  # GT is 256x256 float32 in [0, 1]. Scale factor is exactly 2x.
  scale: 2
  augment: true
  extra_noise_prob: 0.15
  extra_noise_std: 0.05
  speckle_prob: 0.15
  speckle_std: 0.08
  input_dropout_prob: 0.10
  input_dropout_ratio: 0.05

model:
  name: rrdb_restorer
  in_channels: 1
  out_channels: 1
  num_feat: 64
  num_block: 8
  num_grow_ch: 32
  scale: 2
  residual_scale: 0.2
  attn_every: 3
  noise_feat: 32

loss:
  charbonnier_weight: 1.0
  ssim_weight: 1.0
  edge_weight: 0.1
  fft_weight: 0.01
  charbonnier_eps: 1.0e-3

train:
  epochs: 80
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-6
  amp: true
  save_dir: weights
