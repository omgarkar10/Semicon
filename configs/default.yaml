seed: 42

data:
  lr_dir: train/NoisyLR
  gt_dir: train/GT
  test_dir: NoisyLR
  val_ratio: 0.1
  num_workers: 4
  pin_memory: true
  # LR is 128x128 float32 with speckle outside [0, 1]; do not min-max normalize.
  # GT is 256x256 float32 in [0, 1]. Scale factor is exactly 2x.
  scale: 2
  augment: true
  # Reduced aggressive augmentation so model focuses on structure recovery
  extra_noise_prob: 0.10
  extra_noise_std: 0.04
  speckle_prob: 0.08
  speckle_std: 0.06
  input_dropout_prob: 0.05
  input_dropout_ratio: 0.03

model:
  name: rrdb_restorer
  in_channels: 1
  out_channels: 1
  num_feat: 96        # increased from 64 for richer feature maps
  num_block: 16       # increased from 8 (standard ESRGAN uses 23)
  num_grow_ch: 48     # increased from 32 for denser connections
  scale: 2
  residual_scale: 0.2
  attn_every: 4       # CBAM attention every 4 RRDB blocks
  noise_feat: 32

loss:
  charbonnier_weight: 1.0
  ssim_weight: 1.5    # increased: structural accuracy is critical
  edge_weight: 0.15   # slightly higher: preserve thin wafer lines
  fft_weight: 0.05    # increased from 0.01: enforce HF accuracy
  laplacian_weight: 0.05  # new: second-order derivative sharpness
  charbonnier_eps: 1.0e-3

train:
  epochs: 150         # increased from 80
  batch_size: 16      # increased from 8 (utilizes H100 VRAM)
  lr: 2.0e-4          # slightly higher for faster convergence
  weight_decay: 1.0e-4
  amp: true
  save_dir: weights
